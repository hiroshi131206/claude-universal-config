# Claude Universal Config - Django + React Monorepo Template

name: django-react-monorepo
version: 1.0.0

# 言語選択
languages:
  - python
  - typescript

# バックエンドフレームワーク
backend:
  - django

# フロントエンドフレームワーク
frontend:
  - react

# インフラ
infrastructure:
  - docker

# ドメイン固有スキル
domains:
  - web-security

# エージェント有効化
agents:
  code-reviewer:
    enabled: true
    contexts: [python, typescript, django, react]
    custom_checks:
      - "Area-based permissions use get_managed_area_ids() correctly"
      - "API responses follow standard format"
  tdd-guide:
    enabled: true
    contexts: [python, typescript]
  security-reviewer:
    enabled: true
    contexts: [web-security]

# コマンド有効化
commands:
  - review
  - tdd
  - test
  - migrate  # Django専用
  - debug
  - feature
  - autoresearch  # 自律改善ループ（autoresearch:debug/fix/security なども利用可）
  - encoding-fix  # Shift-JIS/EUC-JP/CP932 → UTF-8 変換（古い日本語サイト・ファイルの調査用）

# スキル有効化（コマンドのリファレンスファイル群）
skills:
  - autoresearch  # autoresearch コマンド群が参照するプロトコルファイル

# MCPサーバー（オプション）
# claude-peers: 複数のClaude Codeセッション間でメッセージ共有を行う
# 事前に https://github.com/louislva/claude-peers-mcp をインストールし、
# scope: user の場合は手動で登録が必要（generate.py が案内を出力する）
#
# mcp:
#   claude-peers:
#     enabled: true
#     scope: user                        # user | project
#     install_path: ~/claude-peers-mcp   # インストール先パス
