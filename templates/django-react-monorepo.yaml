# Claude Universal Config - Django + React Monorepo Template

name: django-react-monorepo
version: 1.0.0

# 言語選択
languages:
  - python
  - typescript

# バックエンドフレームワーク
backend:
  - django

# フロントエンドフレームワーク
frontend:
  - react

# インフラ
infrastructure:
  - docker

# ドメイン固有スキル
domains:
  - web-security

# エージェント有効化
agents:
  code-reviewer:
    enabled: true
    contexts: [python, typescript, django, react]
    custom_checks:
      - "Area-based permissions use get_managed_area_ids() correctly"
      - "API responses follow standard format"
  tdd-guide:
    enabled: true
    contexts: [python, typescript]
  security-reviewer:
    enabled: true
    contexts: [web-security]
  deep-explore:
    enabled: true
    contexts: [python, typescript, django, react]
  code-architect:
    enabled: true
    contexts: [python, typescript, django, react]
  code-explorer:
    enabled: true
    contexts: [python, typescript, django, react]
  pr-test-analyzer:
    enabled: true
    contexts: [python, typescript]
  comment-analyzer:
    enabled: true
    contexts: [python, typescript]
  code-simplifier:
    enabled: true
    contexts: [python, typescript]
  silent-failure-hunter:
    enabled: true
    contexts: [python, typescript]
  type-design-analyzer:
    enabled: true
    contexts: [python, typescript]

# コマンド有効化
commands:
  - review
  - review-pr      # PR レビュー（差分 + テスト + コメント分析）
  - tdd
  - test
  - migrate        # Django専用
  - debug
  - feature        # 機能追加（シンプル）
  - feature-dev    # 機能追加（7フェーズ: 設計→TDD→実装→レビュー）
  - commit         # メッセージ自動生成コミット
  - commit-push-pr # コミット + プッシュ + PR 作成
  - autoresearch   # 自律改善ループ（autoresearch:debug/fix/security なども利用可）
  - encoding-fix   # Shift-JIS/EUC-JP/CP932 → UTF-8 変換（古い日本語サイト・ファイルの調査用）

# スキル有効化（コマンドのリファレンスファイル群）
skills:
  - autoresearch  # autoresearch コマンド群が参照するプロトコルファイル
  - grepai        # セマンティック検索スキル（Grep/Glob の代替。入力トークン最大-97%）

# MCPサーバー（オプション）
# claude-peers: 複数のClaude Codeセッション間でメッセージ共有を行う
# 事前に https://github.com/louislva/claude-peers-mcp をインストールし、
# scope: user の場合は手動で登録が必要（generate.py が案内を出力する）
#
# mcp:
#   claude-peers:
#     enabled: true
#     scope: user                        # user | project
#     install_path: ~/claude-peers-mcp   # インストール先パス
#
#   grepai:
#     enabled: true
#     scope: project                     # grepai mcp-serve を .mcp.json に出力
#     # 事前に grepai init && grepai watch を実行しておくこと
